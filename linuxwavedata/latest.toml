# LinuxWave 自更新探针 —— 唯一的入口文件。
#
# 客户端（install.sh / wave selfupdate）只读这一个文件就知道该装哪个版本、
# 该从哪个分支取代码、该执行哪一份更新命令：
#
#   linuxwavedata/latest.toml                 哪个版本是最新的（每次发版都变）
#   linuxwavedata/<版本>/update_commands.sh   那个版本具体怎么装（按版本冻结）
#
# 为什么要两个分开：装了旧版本的用户仍在运行，他们那份更新说明不能因为发了新版
# 就变样。把「当前该装哪个版本」和「那个版本具体怎么装」混在一个文件里就做不到。
#
# 字段：
#   version        这次要装 / 升到的版本
#   release_date   发布日期（YYYY-MM-DD）
#   build_number   构建号：3 位年内第几天 + 一个字母 + HHMM（规则见仓库 docs/BUILD-NUMBER.md）
#   branch         配套的代码分支
#
# 与 lib/domains.py 的 selfupdate_latest_url() 是配套约定：改字段名要两边一起改。

version = "3.2.1"
release_date = "2026-11-08"
build_number = "312A1137"
branch = "3.2"
